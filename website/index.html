<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your website will appear here</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0b0f19; color: #f5f7ff; text-align: center; padding: 2rem;
    }
    .card { max-width: 560px; }
    h1 { font-size: 2.5rem; margin-bottom: 1rem; }
    p { color: #9aa4bf; font-size: 1.1rem; line-height: 1.7; }
    code {
      background: #1a2133; padding: .2rem .5rem; border-radius: 6px;
      color: #6c8cff; font-size: .95em;
    }
    .step { margin-top: 1.5rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎬 No video yet</h1>
    <p>This page is a placeholder. Your generated website will replace it once
       you add a video.</p>
    <p class="step">1. Drop a video into the <code>uploads/</code> folder.</p>
    <p class="step">2. Run <code>python build.py</code> — or just ask me to build it.</p>
  </div>
</body>
</html>
