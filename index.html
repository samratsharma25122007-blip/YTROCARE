<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scroll Video Landing Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0b1020;
      --panel: #141a2e;
      --accent: #6d8bff;
      --accent-2: #b06dff;
      --text: #eef1fb;
      --muted: #9aa4c4;
      --border: #263056;
    }

    html { scroll-behavior: auto; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ---------- Upload panel (shown until a video is chosen) ---------- */
    .builder {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      transition: transform .4s ease, opacity .4s ease;
    }
    .builder.hidden { transform: translateY(-100%); opacity: 0; pointer-events: none; }
    .builder h1 {
      font-size: 16px;
      margin-right: auto;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .upload-btn {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #fff; border: none;
      padding: 11px 20px; border-radius: 10px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: transform .1s ease;
    }
    .upload-btn:hover { transform: translateY(-1px); }
    input[type="file"] { display: none; }
    .filename { font-size: 12px; color: var(--muted); }

    /* ---------- Empty state ---------- */
    .empty {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; color: var(--muted); padding: 24px;
    }
    .empty .icon { font-size: 64px; margin-bottom: 16px; }
    .empty.hidden { display: none; }

    /* ---------- Scroll-scrub stage ---------- */
    /* The tall .scroll-track creates scroll distance; the .sticky layer
       stays pinned in the viewport while the video is scrubbed by scroll. */
    #stage { display: none; }
    #stage.active { display: block; }

    .scroll-track { position: relative; }

    .sticky {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }
    .sticky video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .vignette {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(11,16,32,.35), transparent 25%, transparent 70%, rgba(11,16,32,.75));
      pointer-events: none;
    }

    /* Text captions pinned over the video, fading in at scroll milestones */
    .captions { position: absolute; inset: 0; pointer-events: none; }
    .caption {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: min(820px, 90vw);
      opacity: 0;
      transition: opacity .3s ease;
    }
    .caption.show { opacity: 1; }
    .caption h2 { font-size: clamp(32px, 6vw, 64px); line-height: 1.05; margin-bottom: 12px; }
    .caption p  { font-size: clamp(16px, 2.4vw, 22px); color: var(--muted); }

    /* Scroll hint + progress bar */
    .hint {
      position: fixed;
      left: 50%; bottom: 26px;
      transform: translateX(-50%);
      z-index: 20;
      color: var(--text);
      font-size: 13px; letter-spacing: .04em;
      opacity: .85;
      transition: opacity .3s ease;
      pointer-events: none;
      text-align: center;
    }
    .hint .chev { display: block; font-size: 20px; animation: bob 1.4s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
    .hint.gone { opacity: 0; }

    .progress {
      position: fixed;
      left: 0; top: 0;
      height: 3px; width: 0%;
      z-index: 40;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width .05s linear;
    }

    .loading {
      position: fixed; inset: 0;
      display: none;
      align-items: center; justify-content: center;
      z-index: 30; color: var(--muted); background: #000;
    }
    .loading.show { display: flex; }
  </style>
</head>
<body>

  <!-- Upload panel -->
  <div class="builder" id="builder">
    <h1>🎬 Scroll Video Landing Page</h1>
    <label class="upload-btn">
      Change Video
      <input type="file" id="videoInput" accept="video/*" />
    </label>
    <span class="filename" id="filename">No video selected</span>
  </div>

  <!-- Empty state -->
  <div class="empty" id="empty">
    <div class="icon">📹</div>
    <p>Loading video…<br />Scrolling down plays it forward — scrolling up reverses it.</p>
  </div>

  <!-- Scroll-scrub stage -->
  <div id="stage">
    <div class="progress" id="progress"></div>
    <div class="loading" id="loading">Preparing video…</div>

    <div class="scroll-track" id="track">
      <div class="sticky">
        <video id="video" muted playsinline preload="auto"></video>
        <div class="vignette"></div>
        <div class="captions">
          <div class="caption" data-at="0.02"><h2>Scroll to begin</h2><p>The video moves with you.</p></div>
          <div class="caption" data-at="0.5"><h2>Keep scrolling</h2><p>Down plays forward. Up rewinds.</p></div>
          <div class="caption" data-at="0.95"><h2>You control every frame</h2><p>Your video, your pace.</p></div>
        </div>
      </div>
    </div>

    <div class="hint" id="hint"><span class="chev">⌄</span>scroll</div>
  </div>

  <script>
    const videoInput = document.getElementById('videoInput');
    const filename   = document.getElementById('filename');
    const builder    = document.getElementById('builder');
    const empty      = document.getElementById('empty');
    const stage      = document.getElementById('stage');
    const track      = document.getElementById('track');
    const video      = document.getElementById('video');
    const progress   = document.getElementById('progress');
    const hint       = document.getElementById('hint');
    const loading    = document.getElementById('loading');
    const captions   = Array.from(document.querySelectorAll('.caption'));

    // How many viewport-heights of scrolling map to the whole video.
    // Higher = slower, more deliberate scrubbing.
    const SCROLL_PER_VIDEO = 5; // in screens

    let duration = 0;
    let target = 0;   // where scroll says the playhead should be (seconds)
    let current = 0;  // smoothed playhead we actually seek to
    let raf = null;
    let lastT = 0;    // timestamp of previous animation frame (ms)

    // Higher = the playhead catches up to your scroll faster (less lag, but
    // less "backward playback" feel). Frame-rate independent — see tick().
    const SMOOTH = 12;

    // The video that ships with this page. The 120fps all-intra build is
    // used when present; if it is missing we fall back to the original.
    const DEFAULT_VIDEO   = 'kling_120fps.mp4';
    const FALLBACK_VIDEO  = 'kling_20260714_VIDEO_make_smoot_918_0.mp4';

    function loadVideo(src, name, isDefault) {
      filename.textContent = name;
      video.src = src;
      loading.classList.add('show');
      video.addEventListener('loadedmetadata', onReady, { once: true });
      // If the 120fps file isn't there, quietly load the original instead.
      if (isDefault) {
        video.addEventListener('error', () => {
          loadVideo(FALLBACK_VIDEO, FALLBACK_VIDEO, false);
        }, { once: true });
      }
    }

    // Let the user swap in a different video if they want.
    videoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      loadVideo(URL.createObjectURL(file), file.name);
    });

    // Auto-load the bundled video on page open.
    loadVideo(DEFAULT_VIDEO, DEFAULT_VIDEO, true);

    function onReady() {
      duration = video.duration || 0;

      // Size the scroll track so total scroll distance = SCROLL_PER_VIDEO screens.
      track.style.height = (SCROLL_PER_VIDEO * 100) + 'vh';

      empty.classList.add('hidden');
      builder.classList.add('hidden');
      stage.classList.add('active');
      loading.classList.remove('show');

      // Pause any auto playback — we drive currentTime by scroll only.
      video.pause();
      window.scrollTo(0, 0);
      current = target = 0;

      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
      lastT = 0;
      raf = requestAnimationFrame(tick);
    }

    function onScroll() {
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      const p = maxScroll > 0 ? Math.min(1, Math.max(0, window.scrollY / maxScroll)) : 0;

      target = p * duration;
      progress.style.width = (p * 100) + '%';

      // Fade the scroll hint once the user starts moving.
      if (p > 0.01) hint.classList.add('gone');
      else hint.classList.remove('gone');

      // Show whichever caption is closest to the current scroll milestone.
      captions.forEach((c) => {
        const at = parseFloat(c.dataset.at);
        c.classList.toggle('show', Math.abs(p - at) < 0.12);
      });
    }

    // Smoothly ease the real playhead toward the scroll target every frame.
    // requestAnimationFrame runs at the display's refresh rate, so on a
    // 120Hz screen this loop renders 120 seeks per second. The easing is
    // time-based (uses the real gap between frames), so the motion feels
    // identical on 60Hz and 120Hz instead of running twice as fast on 120Hz.
    // This is what makes reversing (scroll up) look like smooth backward
    // playback rather than snapping frame-to-frame.
    function tick(now) {
      const dt = lastT ? Math.min(0.05, (now - lastT) / 1000) : 1 / 60;
      lastT = now;

      // Frame-rate-independent exponential smoothing toward the scroll target.
      const k = 1 - Math.exp(-SMOOTH * dt);
      current += (target - current) * k;
      if (Math.abs(target - current) < 0.0005) current = target;

      if (duration && video.readyState >= 2) {
        try { video.currentTime = Math.min(duration - 0.001, Math.max(0, current)); } catch (e) {}
      }
      raf = requestAnimationFrame(tick);
    }
  </script>
</body>
</html>
