name: Deploy to GitHub Pages

on:
  push:
    # claude/old is the repo's current default branch; main kept for a
    # future rename.
    branches: [claude/old, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Switches the repo's Pages source to "GitHub Actions" automatically,
      # replacing the classic README/Jekyll deployment.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Pages serves the site at /<repo-name>/, not the domain root.
          NEXT_PUBLIC_BASE_PATH: /YTROCARE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
